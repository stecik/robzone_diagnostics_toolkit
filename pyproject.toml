[project]
name = "robzone-diag"
version = "0.1.0"
description = "Diagnostic toolkit for Robzone robotic vacuum cleaners (LAN discovery, telemetry, fault isolation)"
readme = "README.md"
authors = [{ name = "stecik" }]
requires-python = ">=3.11"
keywords = ["robzone", "robot-vacuum", "diagnostics", "lidar", "reverse-engineering"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    # AES for decoding Tuya LAN discovery broadcasts (hypothesis still under test).
    "cryptography>=42",
]

[project.urls]
Repository = "https://github.com/stecik/robzone_diagnostics_toolkit"

[project.scripts]
robzone-diag = "robzone_diag.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    # Reference implementation of the Tuya LAN protocol; used only in tests to
    # cross-check our decoder against packets built by an independent codebase.
    "tinytuya>=1.13",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
